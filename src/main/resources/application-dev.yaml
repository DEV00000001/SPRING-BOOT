server: 
  port: 8001
spring:
  application:
    name: springboot-dev001
  datasource:
    url: jdbc:mysql://localhost:3306/SpringBootDB
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true


